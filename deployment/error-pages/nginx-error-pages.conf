# Al Fahidi Fort: branded error pages served by Nginx when the Next.js app cannot answer.
#
# Install once on the server:
#   sudo mkdir -p /var/www/alfahidifort-errors
#   sudo cp deployment/error-pages/*.html /var/www/alfahidifort-errors/
#
# Then include the two blocks below inside the existing `server { ... }`:
#   - the `error_page` lines go inside `location /alfahidifort/ { ... }` (next to proxy_pass);
#   - the `location ^~ /alfahidifort-errors/` block goes next to it at server level.
#
# 404 and 500 responses produced by the app keep the app's own branded pages (Nginx only replaces
# errors it generates itself, e.g. upstream down/timeouts, because proxy_intercept_errors is off).

# --- inside: location /alfahidifort/ { ... } -------------------------------------------------
error_page 502 /alfahidifort-errors/502.html;
error_page 503 /alfahidifort-errors/503.html;
error_page 504 /alfahidifort-errors/504.html;

# --- at server level ---------------------------------------------------------------------------
location ^~ /alfahidifort-errors/ {
    internal;
    alias /var/www/alfahidifort-errors/;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

# Planned maintenance: uncomment inside `location /alfahidifort/ { ... }` to show 503.html to
# every visitor, then reload Nginx. Comment it out again afterwards.
