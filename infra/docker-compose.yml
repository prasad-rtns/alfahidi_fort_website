services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfahidi}
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-alfahidi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8088}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://payloadcms:3001}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
    depends_on:
      - payloadcms

  payloadcms:
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
      args:
        CMS_ASSET_PREFIX: ${CMS_ASSET_PREFIX:-/cms-assets}
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:8088}
      DATABASE_URI: postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-alfahidi}
      CMS_REVALIDATE_URL: http://web:3000/api/revalidate
      CMS_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
      CMS_ASSET_PREFIX: ${CMS_ASSET_PREFIX:-/cms-assets}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cms-media:/app/apps/cms/media

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - payloadcms

volumes:
  postgres-data:
  cms-media:
